services:
  supabasetubesync:
    build: .
    container_name: supabasetubesync   
    restart: always
    environment:
      API_TOKEN: ${API_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      TUBE_API_URL:  ${TUBE_API_URL}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-test}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION:-youtubeque}
